<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <h1 id="title" class="text-center mt-4 mb-4 text-primary-emphasis">
        Attendance Tracker <span style="margin-left: 500px;">
            <svg id="themechange" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="rgba(0,0,0,0.5)" class="bi bi-moon-fill" viewBox="0 0 16 16">
  <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
</svg>
        </span>
    </h1>

    <!-- JavaScript will insert all student rows here -->
    <div id="main-div"></div>

    <!-- Statistics Section -->
    <div class="container  mt-5" id="lastsection">
        <div class="row">

            <div class="col ">
                <div class="border rounded p-3 bg-light lastcols">
                    Present :
                    <span id="present-count">20</span>
                </div>
            </div>

            <div class="col">
                <div class="border rounded p-3 bg-light lastcols">
                    Absent :
                    <span id="absent-count">0</span>
                </div>
            </div>

            <div class="col">
                <div class="border rounded p-3 bg-light lastcols">
                    Absent Roll Numbers:
                    <div id="absentdisplay"></div>
                </div>
            </div>

        </div>
    </div>

<div class="text-center">
<button id="clearAll">Clear All</button>
</div>

    <script src="project.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
